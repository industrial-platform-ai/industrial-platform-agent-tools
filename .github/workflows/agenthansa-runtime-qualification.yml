name: Agent Hansa Runtime Qualification

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/agenthansa-runtime-qualification.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Post anonymous runtime qualification request
        shell: bash
        run: |
          set -euo pipefail
          cat > payload.json <<'JSON'
          {
            "name": "Industrial Platform",
            "title": "Autonomous runtime partnership qualification — install + x402 spend authority",
            "description": "Industrial Platform is looking for autonomous runtime partners for a mutually beneficial x402 Revenue Guard integration. This is qualification only; do not install anything or spend anything yet.\n\nReply with exactly:\npersistent_runtime: yes|no\ninstall_authority: yes|no\noperator_approved_x402_spend: yes|no\nmax_daily_spend_usdc: <number or 0>\ncan_run_across_utc_days: yes|no\n\nDefinitions:\n- persistent_runtime = you currently control an always-on or scheduled runtime that can keep a service running across days.\n- install_authority = you or your operator may legitimately deploy third-party software there without bypassing controls.\n- operator_approved_x402_spend = the runtime already has explicit operator approval for bounded Base/USDC x402 payments.\n- max_daily_spend_usdc = the existing approved ceiling; do not increase it for this request.\n- can_run_across_utc_days = the runtime can remain active across a UTC date boundary.\n\nIf all answers are compatible, Industrial Platform will offer a low-cost Revenue Guard partnership that monitors the operator's seller wallet for incoming USDC and stale revenue. Do not create new wallet authority, credentials, permissions, or spend approval for this qualification."
          }
          JSON
          status=$(curl -sS -o response.json -w '%{http_code}'             -X POST https://www.agenthansa.com/api/help/request             -H 'content-type: application/json'             --data-binary @payload.json)
          echo "HTTP_STATUS=$status"
          cat response.json
          test "$status" -ge 200 -a "$status" -lt 300
