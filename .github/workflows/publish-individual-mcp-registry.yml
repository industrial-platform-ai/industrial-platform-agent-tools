name: Publish Individual MCP Registry Entries

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'registry/**/server.json'
      - '.github/workflows/publish-individual-mcp-registry.yml'

concurrency:
  group: industrial-platform-mcp-registry-publish
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install MCP publisher
        run: |
          curl -L "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" \
            | tar xz mcp-publisher
          chmod +x ./mcp-publisher

      - name: Validate individual server definitions
        run: |
          for FILE in registry/*/server.json; do
            echo "Validating $FILE"
            ./mcp-publisher validate "$FILE"
          done

      - name: Authenticate with GitHub OIDC
        run: ./mcp-publisher login github-oidc --registry=https://registry.modelcontextprotocol.io

      - name: Publish missing individual service versions
        run: |
          set -euo pipefail

          for FILE in registry/*/server.json; do
            NAME=$(node -e "const x=require('./${FILE}'); process.stdout.write(x.name)")
            VERSION=$(node -e "const x=require('./${FILE}'); process.stdout.write(x.version)")

            echo "Checking $NAME@$VERSION"

            curl --fail-with-body --silent --show-error --get \
              --data-urlencode "search=$NAME" \
              --data-urlencode "version=latest" \
              "https://registry.modelcontextprotocol.io/v0.1/servers" > registry-response.json

            FOUND=$(NAME="$NAME" VERSION="$VERSION" node -e "const fs=require('fs'); const body=JSON.parse(fs.readFileSync('registry-response.json','utf8')); const found=(body.servers||[]).some((entry)=>{const server=entry.server||entry; return server.name===process.env.NAME && server.version===process.env.VERSION;}); process.stdout.write(found?'true':'false');")

            if [ "$FOUND" = "true" ]; then
              echo "Already published: $NAME@$VERSION"
              continue
            fi

            echo "Publishing $FILE"
            set +e
            OUTPUT=$(./mcp-publisher publish "$FILE" 2>&1)
            STATUS=$?
            set -e
            echo "$OUTPUT"

            if [ "$STATUS" -ne 0 ]; then
              if echo "$OUTPUT" | grep -q "cannot publish duplicate version"; then
                echo "Registry reports duplicate version; treating as already published: $NAME@$VERSION"
              else
                exit "$STATUS"
              fi
            fi
          done
