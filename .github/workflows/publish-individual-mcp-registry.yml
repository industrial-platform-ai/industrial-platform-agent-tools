name: Publish Individual MCP Registry Entries

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'registry/**/server.json'
      - '.github/workflows/publish-individual-mcp-registry.yml'

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install MCP publisher
        run: |
          curl -L "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz"             | tar xz mcp-publisher
          chmod +x ./mcp-publisher

      - name: Validate individual server definitions
        run: |
          for FILE in registry/*/server.json; do
            echo "Validating $FILE"
            ./mcp-publisher validate "$FILE"
          done

      - name: Authenticate with GitHub OIDC
        run: ./mcp-publisher login github-oidc --registry=https://registry.modelcontextprotocol.io

      - name: Publish individual service listings
        run: |
          for FILE in registry/*/server.json; do
            echo "Publishing $FILE"
            ./mcp-publisher publish "$FILE"
          done
