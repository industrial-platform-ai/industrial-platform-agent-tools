name: Reconcile Link Intelligence Publication

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/reconcile-link-publication.yml'
  schedule:
    - cron: '47 3 * * *'

permissions:
  contents: read

concurrency:
  group: industrial-platform-link-publication-reconcile
  cancel-in-progress: false

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - name: Reconcile Actor publication state
        id: reconcile
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
        run: |
          node <<'NODE'
          const fs = require('fs');
          (async () => {
          const actorId = 'industrial_platform~link-intelligence';
          const url = 'https://api.apify.com/v2/actors/' + actorId;
          const token = process.env.APIFY_TOKEN;
          if (!token) throw new Error('APIFY_TOKEN is required.');

          const desired = {
            title: 'Link Extractor for AI Agents',
            description: 'Extract links, anchors, rel flags and link class. Price: $0.0005 per successful page.',
            categories: ['AI', 'DEVELOPER_TOOLS', 'SEO_TOOLS'],
            isPublic: true,
            defaultRunOptions: {
              build: 'latest',
              timeoutSecs: 180,
              memoryMbytes: 512,
              restartOnError: false,
              forcePermissionLevel: 'LIMITED_PERMISSIONS'
            },
            actorStandby: { isEnabled: false },
            exampleRunInput: {
              body: JSON.stringify({ urls: ['https://example.com/'] }),
              contentType: 'application/json; charset=utf-8'
            },
            pricingInfos: [{
              pricingModel: 'PAY_PER_EVENT',
              pricingPerEvent: {
                actorChargeEvents: {
                  'link-extraction': {
                    eventTitle: 'Link extraction',
                    eventDescription: 'One successfully processed source page.',
                    eventPriceUsd: 0.0005,
                    isPrimaryEvent: true,
                    isOneTimeEvent: false
                  }
                }
              }
            }]
          };

          const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));
          const output = (key, value) => fs.appendFileSync(process.env.GITHUB_OUTPUT, key + '=' + value + '\n');

          async function readActor() {
            const response = await fetch(url, {
              headers: { Authorization: 'Bearer ' + token, Accept: 'application/json' }
            });
            const text = await response.text();
            if (!response.ok) throw new Error('GET Actor HTTP ' + response.status + ': ' + text.slice(0, 1500));
            return JSON.parse(text).data;
          }

          function state(actor) {
            const current = actor.pricingInfos?.[actor.pricingInfos.length - 1];
            const event = current?.pricingPerEvent?.actorChargeEvents?.['link-extraction'];
            return {
              configured:
                actor.isPublic === true &&
                actor.defaultRunOptions?.forcePermissionLevel === 'LIMITED_PERMISSIONS' &&
                actor.actorStandby?.isEnabled !== true &&
                current?.pricingModel === 'PAY_PER_EVENT' &&
                event?.eventPriceUsd === 0.0005 &&
                event?.isPrimaryEvent === true,
              isPublic: actor.isPublic,
              permission: actor.defaultRunOptions?.forcePermissionLevel ?? null,
              standby: actor.actorStandby?.isEnabled ?? null,
              pricingModel: current?.pricingModel ?? null,
              eventPriceUsd: event?.eventPriceUsd ?? null,
              primary: event?.isPrimaryEvent ?? null
            };
          }

          let actor = await readActor();
          let currentState = state(actor);
          console.log('before=' + JSON.stringify(currentState));

          if (currentState.configured) {
            output('ready', 'true');
            output('changed', 'false');
            output('deferred', 'false');
            console.log('Link Intelligence is already reconciled.');
            process.exit(0);
          }

          let delayMs = 1000;
          let lastFailure = null;

          for (let attempt = 1; attempt <= 8; attempt += 1) {
            const response = await fetch(url, {
              method: 'PUT',
              headers: {
                Authorization: 'Bearer ' + token,
                'Content-Type': 'application/json',
                Accept: 'application/json'
              },
              body: JSON.stringify(desired)
            });

            const text = await response.text();
            let parsed = null;
            try { parsed = JSON.parse(text); } catch {}

            const diagnostics = {
              attempt,
              status: response.status,
              rateLimitLimit: response.headers.get('x-ratelimit-limit'),
              retryAfter: response.headers.get('retry-after'),
              errorType: parsed?.error?.type ?? null,
              message: parsed?.error?.message ?? text.slice(0, 1000)
            };

            if (response.ok) {
              console.log('update=' + JSON.stringify(diagnostics));
              break;
            }

            lastFailure = diagnostics;
            console.log('update_failure=' + JSON.stringify(diagnostics));

            if (diagnostics.errorType === 'daily-publication-limit-exceeded') {
              output('ready', 'false');
              output('changed', 'false');
              output('deferred', 'true');
              console.log('Publication deferred by Apify daily publication quota. The daily schedule will retry automatically.');
              process.exit(0);
            }

            if (response.status !== 429 || attempt === 8) {
              throw new Error('Actor reconciliation failed: ' + JSON.stringify(diagnostics));
            }

            const retryAfter = Number(response.headers.get('retry-after'));
            const headerDelay = Number.isFinite(retryAfter) && retryAfter > 0 ? retryAfter * 1000 : 0;
            const waitMs = Math.max(delayMs, headerDelay);
            await sleep(waitMs);
            delayMs = Math.min(delayMs * 2, 120000);
          }

          actor = await readActor();
          currentState = state(actor);
          console.log('after=' + JSON.stringify(currentState));
          if (!currentState.configured) {
            throw new Error('Link Intelligence did not converge. Last failure: ' + JSON.stringify(lastFailure));
          }

          output('ready', 'true');
          output('changed', 'true');
          output('deferred', 'false');
          })().catch((error) => {
            console.error(error);
            process.exit(1);
          });
          NODE

      - name: Smoke test newly published Actor
        if: steps.reconcile.outputs.changed == 'true'
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
        run: |
          curl --retry 3 --retry-delay 5 --retry-all-errors --fail-with-body --silent --show-error \
            --request POST \
            --header "Authorization: Bearer $APIFY_TOKEN" \
            --header "Content-Type: application/json" \
            --data '{"urls":["https://example.com/"],"max_links_per_page":25}' \
            "https://api.apify.com/v2/actors/industrial_platform~link-intelligence/run-sync-get-dataset-items?clean=true&format=json&timeout=90" \
            > result.json

          node <<'NODE'
          const fs = require('fs');
          const rows = JSON.parse(fs.readFileSync('result.json', 'utf8'));
          if (!Array.isArray(rows) || rows.length < 1) throw new Error('Expected at least one dataset row.');
          const row = rows[0];
          if (row.status !== 'ready') throw new Error('Smoke test row is not ready: ' + JSON.stringify(row));
          if (!Array.isArray(row.links) || row.links.length < 1) throw new Error('Smoke test returned no links.');
          console.log(JSON.stringify({
            returned_links: row.returned_links,
            sample: row.links[0]
          }, null, 2));
          NODE
