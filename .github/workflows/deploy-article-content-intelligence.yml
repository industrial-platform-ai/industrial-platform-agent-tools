name: Deploy Article Content Intelligence

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'actors/article-content-intelligence/**'
      - '.github/workflows/deploy-article-content-intelligence.yml'

concurrency:
  group: industrial-platform-apify-build-lane-3
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        working-directory: actors/article-content-intelligence
        run: npm install

      - name: Run checks
        working-directory: actors/article-content-intelligence
        run: |
          npm run check
          npm test

      - name: Push and build Actor on Apify
        uses: apify/push-actor-action@v1
        with:
          token: ${{ secrets.APIFY_TOKEN }}
          working-directory: ${{ github.workspace }}/actors/article-content-intelligence

      - name: Configure runtime, pricing, and publication idempotently
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
        run: |
          curl --fail-with-body --silent --show-error             --header "Authorization: Bearer $APIFY_TOKEN"             "https://api.apify.com/v2/actors/industrial_platform~article-content-intelligence"             > current.json

          node <<'NODE'
          const fs = require('fs');
          const actor = JSON.parse(fs.readFileSync('current.json','utf8')).data;
          const current = actor.pricingInfos?.[actor.pricingInfos.length - 1];
          const event = current?.pricingPerEvent?.actorChargeEvents?.['article-extraction'];

          const payload = {
            title: 'Article Content Extractor for AI Agents',
            description: 'Use to extract clean article body text plus title, author, dates, canonical URL, and JSON-LD for RAG, research, summarization, and downstream agents.',
            categories: ['AI','DEVELOPER_TOOLS'],
            isPublic: true,
            defaultRunOptions: {
              build: 'latest',
              timeoutSecs: 180,
              memoryMbytes: 512,
              restartOnError: false,
              forcePermissionLevel: 'LIMITED_PERMISSIONS'
            },
            actorStandby: { isEnabled: false }
          };

          const correct = current?.pricingModel === 'PAY_PER_EVENT'
            && event?.eventPriceUsd === 0.002
            && event?.isPrimaryEvent === true;

          if (!correct) {
            payload.pricingInfos = [{
              pricingModel: 'PAY_PER_EVENT',
              pricingPerEvent: {
                actorChargeEvents: {
                  'article-extraction': {
                    eventTitle: 'Article extraction',
                    eventDescription: 'One successful article content extraction.',
                    eventPriceUsd: 0.002,
                    isPrimaryEvent: true,
                    isOneTimeEvent: false
                  }
                }
              }
            }];
          }

          fs.writeFileSync('payload.json', JSON.stringify(payload));
          NODE

          curl --fail-with-body --silent --show-error             --request PUT             --header "Authorization: Bearer $APIFY_TOKEN"             --header "Content-Type: application/json"             --data @payload.json             "https://api.apify.com/v2/actors/industrial_platform~article-content-intelligence"             > actor.json

      - name: Smoke test
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
        run: |
          curl --fail-with-body --silent --show-error             --request POST             --header "Authorization: Bearer $APIFY_TOKEN"             --header "Content-Type: application/json"             --data '{"urls":["https://example.com/"]}'             "https://api.apify.com/v2/actors/industrial_platform~article-content-intelligence/run-sync-get-dataset-items?clean=true&format=json&timeout=60"             > result.json
          node -e "const r=require('./result.json'); if(!Array.isArray(r)||!['ready','error'].includes(r[0]?.status)) process.exit(1)"
