name: Optimize Top Three Paid Conversion

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/optimize-top-three-conversion.yml'

permissions:
  contents: read

jobs:
  optimize:
    runs-on: ubuntu-latest
    steps:
      - name: Update top-three agent selection metadata
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
        run: |
          node <<'NODE'
          const token = process.env.APIFY_TOKEN;
          if (!token) throw new Error('APIFY_TOKEN missing');

          const updates = {
            'research-brief-agent': {
              description: 'Use for current cited multi-source research, comparisons, and fact verification. Returns a synthesized brief with citations. $1.99 per completed brief; failed runs are not billed.',
              exampleRunInput: {
                body: JSON.stringify({
                  research_question: 'Compare the current pricing and key differences between GitHub Copilot Pro and Cursor Pro.',
                  context: 'The result will support a software-tool purchasing decision.',
                  requirements: 'Use current official sources where possible. Include pricing, major differences, citations, and unresolved facts.'
                }),
                contentType: 'application/json; charset=utf-8'
              }
            },
            'web-metadata-intelligence': {
              description: 'Use for Open Graph, JSON-LD, canonical, robots, headings, language, and page metadata. Input: urls[]. $0.01 per successful URL; failed URLs are not billed.',
              exampleRunInput: {
                body: JSON.stringify({ urls: ['https://example.com/'] }),
                contentType: 'application/json; charset=utf-8'
              }
            },
            'web-change-intelligence': {
              description: 'Use to baseline a URL or compare prior text/hash for changed/unchanged status and deterministic diffs. Input: url. $0.01 per successful comparison; failed fetches are not billed.',
              exampleRunInput: {
                body: JSON.stringify({
                  url: 'https://example.com/',
                  include_current_text: true
                }),
                contentType: 'application/json; charset=utf-8'
              }
            }
          };

          for (const [name, payload] of Object.entries(updates)) {
            const response = await fetch(
              'https://api.apify.com/v2/actors/industrial_platform~' + name,
              {
                method: 'PUT',
                headers: {
                  Authorization: 'Bearer ' + token,
                  'Content-Type': 'application/json'
                },
                body: JSON.stringify(payload)
              }
            );
            const text = await response.text();
            if (!response.ok) throw new Error(name + ': HTTP ' + response.status + ' ' + text.slice(0,1500));
            console.log(name + ': updated');
          }
          NODE

      - name: Verify live conversion metadata
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
        run: |
          node <<'NODE'
          const expected = {
            'research-brief-agent': 'research_question',
            'web-metadata-intelligence': 'urls',
            'web-change-intelligence': 'url'
          };

          for (const [name, requiredKey] of Object.entries(expected)) {
            const response = await fetch(
              'https://api.apify.com/v2/actors/industrial_platform~' + name,
              { headers: { Authorization: 'Bearer ' + process.env.APIFY_TOKEN } }
            );
            const body = await response.json();
            if (!response.ok) throw new Error(name + ': ' + JSON.stringify(body));
            const actor = body.data ?? {};
            const example = JSON.parse(actor.exampleRunInput?.body ?? '{}');
            const summary = {
              name,
              description: actor.description,
              exampleRunInput: actor.exampleRunInput
            };
            console.log(JSON.stringify(summary, null, 2));
            if (!(requiredKey in example)) {
              throw new Error(name + ': live example input missing required key ' + requiredKey);
            }
            if (/helloWorld/i.test(actor.exampleRunInput?.body ?? '')) {
              throw new Error(name + ': stale helloWorld example still present');
            }
          }
          NODE
