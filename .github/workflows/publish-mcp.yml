name: Publish MCP Registry

on:
  push:
    branches: ["main"]
    paths:
      - "server.json"
      - ".github/workflows/publish-mcp.yml"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: publish-mcp-registry
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install MCP publisher
        run: |
          curl -L "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" | tar xz mcp-publisher

      - name: Validate server metadata
        run: |
          test -f server.json
          jq -e '.name == "io.github.industrial-platform-ai/industrial-platform"' server.json
          jq -e '.remotes[0].type == "streamable-http"' server.json
          jq -e '.remotes[0].url == "https://x402-mcp-gateway-production.up.railway.app/mcp"' server.json

      - name: Authenticate with GitHub OIDC
        run: ./mcp-publisher login github-oidc

      - name: Publish remote MCP server
        run: ./mcp-publisher publish ./server.json
