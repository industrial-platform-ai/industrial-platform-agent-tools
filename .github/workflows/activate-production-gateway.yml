name: Activate Production x402 Gateway

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/activate-production-gateway.yml'

permissions:
  contents: write

jobs:
  activate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify, register, and snapshot
        env:
          ORIGIN: https://x402-gateway-production-1f21.up.railway.app
        run: |
          mkdir -p observability
          node <<'NODE'
          import fs from 'node:fs';

          const origin = process.env.ORIGIN.replace(/\/$/, '');

          async function req(url, init = {}) {
            const started = Date.now();
            try {
              const r = await fetch(url, { redirect: 'manual', ...init });
              const text = await r.text();
              let body = text;
              try { body = JSON.parse(text); } catch {}
              return {
                status: r.status,
                ok: r.ok,
                elapsedMs: Date.now() - started,
                headers: Object.fromEntries(r.headers),
                body
              };
            } catch (error) {
              return {
                status: null,
                ok: false,
                elapsedMs: Date.now() - started,
                error: String(error)
              };
            }
          }

          const snapshot = { generatedAt: new Date().toISOString(), origin };

          snapshot.health = await req(origin + '/health');
          snapshot.manifest = await req(origin + '/.well-known/x402');
          snapshot.openapi = await req(origin + '/openapi.json');

          snapshot.metadata = await req(origin + '/metadata', {
            method: 'POST',
            headers: { 'content-type': 'application/json' },
            body: JSON.stringify({ urls: ['https://example.com/'] })
          });

          snapshot.change = await req(origin + '/change', {
            method: 'POST',
            headers: { 'content-type': 'application/json' },
            body: JSON.stringify({ url: 'https://example.com/', include_current_text: false })
          });

          snapshot.agent402Register = await req('https://agent402.tools/api/index/register', {
            method: 'POST',
            headers: { 'content-type': 'application/json' },
            body: JSON.stringify({ origin })
          });

          const host = new URL(origin).host;
          snapshot.agent402Index = await req(
            'https://agent402.tools/api/index?seller=' + encodeURIComponent(host)
          );

          snapshot.agent402FindMetadata = await req(
            'https://agent402.tools/api/find?q=' +
            encodeURIComponent('web metadata extractor Open Graph JSON-LD canonical robots')
          );

          snapshot.agent402FindChange = await req(
            'https://agent402.tools/api/find?q=' +
            encodeURIComponent('website change detector deterministic diff monitor')
          );

          fs.writeFileSync(
            'observability/production-gateway-activation.json',
            JSON.stringify(snapshot, null, 2) + '\n'
          );

          const required = {
            health200: snapshot.health.status === 200,
            manifest200: snapshot.manifest.status === 200,
            openapi200: snapshot.openapi.status === 200,
            metadata402: snapshot.metadata.status === 402,
            change402: snapshot.change.status === 402,
            agent402Registered:
              snapshot.agent402Register.status >= 200 &&
              snapshot.agent402Register.status < 300
          };

          console.log(JSON.stringify({ required, snapshot }, null, 2));
          if (Object.values(required).some(v => !v)) process.exit(1);
          NODE

      - name: Persist activation evidence
        run: |
          git config user.name "industrial-platform-bot"
          git config user.email "art@naturalist.gallery"
          git add observability/production-gateway-activation.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Record production x402 gateway activation"
          git pull --rebase origin main
          git push
