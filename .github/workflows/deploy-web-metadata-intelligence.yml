name: Deploy Web Metadata Intelligence

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'actors/web-metadata-intelligence/**'
      - '.github/workflows/deploy-web-metadata-intelligence.yml'

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        working-directory: actors/web-metadata-intelligence
        run: npm install
      - name: Run checks
        working-directory: actors/web-metadata-intelligence
        run: |
          npm run check
          npm test
      - name: Push and build Actor on Apify
        id: push
        uses: apify/push-actor-action@v1
        with:
          token: ${{ secrets.APIFY_TOKEN }}
          working-directory: ${{ github.workspace }}/actors/web-metadata-intelligence
      - name: Smoke test
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
        run: |
          curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Authorization: Bearer $APIFY_TOKEN" \
            --header "Content-Type: application/json" \
            --data '{"urls":["https://example.com/"]}' \
            "https://api.apify.com/v2/actors/industrial_platform~web-metadata-intelligence/run-sync-get-dataset-items?clean=true&format=json&timeout=60" \
            > result.json
          node <<'NODE'
          const fs = require('fs');
          const rows = JSON.parse(fs.readFileSync('result.json', 'utf8'));
          if (!Array.isArray(rows) || rows.length !== 1) throw new Error('Expected one dataset row.');
          if (rows[0].status !== 'ready') throw new Error('Smoke test did not return ready status.');
          if (!rows[0].title) throw new Error('Smoke test did not extract a title.');
          console.log(JSON.stringify(rows[0], null, 2));
          NODE
