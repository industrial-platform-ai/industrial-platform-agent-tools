name: Deploy Web Metadata Intelligence

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'actors/web-metadata-intelligence/**'
      - '.github/workflows/deploy-web-metadata-intelligence.yml'

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        working-directory: actors/web-metadata-intelligence
        run: npm install

      - name: Run checks
        working-directory: actors/web-metadata-intelligence
        run: |
          npm run check
          npm test

      - name: Push and build Actor on Apify
        id: push
        uses: apify/push-actor-action@v1
        with:
          token: ${{ secrets.APIFY_TOKEN }}
          working-directory: ${{ github.workspace }}/actors/web-metadata-intelligence

      - name: Configure runtime, PPE pricing, and publication
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
        run: |
          cat > payload.json <<'JSON'
          {
            "title": "Web Metadata Intelligence",
            "description": "Extract machine-readable metadata from public web pages for AI agents and automated workflows. Returns title, description, canonical URL, robots directives, Open Graph, Twitter Cards, JSON-LD, headings, language, charset, response size, and latency without per-run LLM cost.",
            "categories": ["AI"],
            "isPublic": true,
            "defaultRunOptions": {
              "build": "latest",
              "timeoutSecs": 180,
              "memoryMbytes": 512,
              "restartOnError": false,
              "forcePermissionLevel": "LIMITED_PERMISSIONS"
            },
            "actorStandby": { "isEnabled": false },
            "exampleRunInput": {
              "body": "{\"urls\":[\"https://example.com/\"]}",
              "contentType": "application/json; charset=utf-8"
            },
            "pricingInfos": [
              {
                "pricingModel": "PAY_PER_EVENT",
                "pricingPerEvent": {
                  "actorChargeEvents": {
                    "metadata-extraction": {
                      "eventTitle": "Metadata extraction",
                      "eventDescription": "One successful public URL metadata extraction.",
                      "eventPriceUsd": 0.01,
                      "isPrimaryEvent": true,
                      "isOneTimeEvent": false
                    }
                  }
                }
              }
            ]
          }
          JSON

          curl --fail-with-body --silent --show-error \
            --request PUT \
            --header "Authorization: Bearer $APIFY_TOKEN" \
            --header "Content-Type: application/json" \
            --data @payload.json \
            "https://api.apify.com/v2/actors/industrial_platform~web-metadata-intelligence" \
            > actor.json

          node <<'NODE'
          const fs = require('fs');
          const actor = JSON.parse(fs.readFileSync('actor.json','utf8')).data;
          const current = actor.pricingInfos?.[actor.pricingInfos.length - 1];
          const event = current?.pricingPerEvent?.actorChargeEvents?.['metadata-extraction'];

          console.log(JSON.stringify({
            isPublic: actor.isPublic,
            permissionLevel: actor.defaultRunOptions?.forcePermissionLevel,
            memoryMbytes: actor.defaultRunOptions?.memoryMbytes,
            standbyEnabled: actor.actorStandby?.isEnabled ?? false,
            pricingModel: current?.pricingModel,
            eventPriceUsd: event?.eventPriceUsd,
            primaryEvent: event?.isPrimaryEvent
          }, null, 2));

          if (!actor.isPublic) throw new Error('Actor is not public.');
          if (actor.defaultRunOptions?.forcePermissionLevel !== 'LIMITED_PERMISSIONS') throw new Error('Actor is not limited-permissions.');
          if (actor.actorStandby?.isEnabled) throw new Error('Standby must be disabled.');
          if (current?.pricingModel !== 'PAY_PER_EVENT') throw new Error('Actor is not PPE.');
          if (!event?.isPrimaryEvent) throw new Error('Primary event not configured.');
          NODE

      - name: Smoke test
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
        run: |
          curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Authorization: Bearer $APIFY_TOKEN" \
            --header "Content-Type: application/json" \
            --data '{"urls":["https://example.com/"]}' \
            "https://api.apify.com/v2/actors/industrial_platform~web-metadata-intelligence/run-sync-get-dataset-items?clean=true&format=json&timeout=60" \
            > result.json

          node <<'NODE'
          const fs = require('fs');
          const rows = JSON.parse(fs.readFileSync('result.json', 'utf8'));
          if (!Array.isArray(rows) || rows.length !== 1) throw new Error('Expected one dataset row.');
          if (rows[0].status !== 'ready') throw new Error('Smoke test did not return ready status.');
          if (!rows[0].title) throw new Error('Smoke test did not extract a title.');
          console.log(JSON.stringify({
            status: rows[0].status,
            title: rows[0].title,
            final_url: rows[0].final_url
          }, null, 2));
          NODE
