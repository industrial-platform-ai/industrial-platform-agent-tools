name: Deploy Web Metadata Intelligence

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'actors/web-metadata-intelligence/**'
      - '.github/workflows/deploy-web-metadata-intelligence.yml'

concurrency:
  group: industrial-platform-apify-build-lane-2
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        working-directory: actors/web-metadata-intelligence
        run: npm install

      - name: Run checks
        working-directory: actors/web-metadata-intelligence
        run: |
          npm run check
          npm test

      - name: Push and build Actor on Apify
        uses: apify/push-actor-action@v1
        with:
          token: ${{ secrets.APIFY_TOKEN }}
          working-directory: ${{ github.workspace }}/actors/web-metadata-intelligence

      - name: Configure runtime, pricing, and publication idempotently
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
        run: |
          curl --fail-with-body --silent --show-error             --header "Authorization: Bearer $APIFY_TOKEN"             "https://api.apify.com/v2/actors/industrial_platform~web-metadata-intelligence"             > current.json

          node <<'NODE'
          const fs = require('fs');
          const actor = JSON.parse(fs.readFileSync('current.json','utf8')).data;
          const current = actor.pricingInfos?.[actor.pricingInfos.length - 1];
          const event = current?.pricingPerEvent?.actorChargeEvents?.['metadata-extraction'];

          const payload = {
            title: 'Web Metadata Extractor for AI Agents',
            description: 'Use for Open Graph, JSON-LD, canonical, robots, headings, language, and page metadata. Input: urls[]. $0.01 per successful URL; failed URLs are not billed.',
            categories: ['AI','DEVELOPER_TOOLS','SEO_TOOLS'],
            isPublic: true,
            defaultRunOptions: {
              build: 'latest',
              timeoutSecs: 180,
              memoryMbytes: 512,
              restartOnError: false,
              forcePermissionLevel: 'LIMITED_PERMISSIONS'
            },
            actorStandby: { isEnabled: false },
            exampleRunInput: {
              body: JSON.stringify({ urls: ['https://example.com/'] }),
              contentType: 'application/json; charset=utf-8'
            }
          };

          const correct = current?.pricingModel === 'PAY_PER_EVENT'
            && event?.eventPriceUsd === 0.01
            && event?.isPrimaryEvent === true;

          if (!correct) {
            payload.pricingInfos = [{
              pricingModel: 'PAY_PER_EVENT',
              pricingPerEvent: {
                actorChargeEvents: {
                  'metadata-extraction': {
                    eventTitle: 'Metadata extraction',
                    eventDescription: 'One successful public URL metadata extraction.',
                    eventPriceUsd: 0.01,
                    isPrimaryEvent: true,
                    isOneTimeEvent: false
                  }
                }
              }
            }];
          }

          fs.writeFileSync('payload.json', JSON.stringify(payload));
          NODE

          curl --fail-with-body --silent --show-error             --request PUT             --header "Authorization: Bearer $APIFY_TOKEN"             --header "Content-Type: application/json"             --data @payload.json             "https://api.apify.com/v2/actors/industrial_platform~web-metadata-intelligence"             > actor.json

      - name: Smoke test
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
        run: |
          curl --fail-with-body --silent --show-error             --request POST             --header "Authorization: Bearer $APIFY_TOKEN"             --header "Content-Type: application/json"             --data '{"urls":["https://example.com/"]}'             "https://api.apify.com/v2/actors/industrial_platform~web-metadata-intelligence/run-sync-get-dataset-items?clean=true&format=json&timeout=60"             > result.json
          node -e "const r=require('./result.json'); if(!Array.isArray(r)||r[0]?.status!=='ready'||!r[0]?.title) process.exit(1)"
