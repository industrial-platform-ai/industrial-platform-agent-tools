name: Publish Industrial Sentinel Runtime

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "industrial-sentinel/**"
      - "industrial-sentinel-runtime/**"
      - ".github/workflows/publish-industrial-sentinel-runtime.yml"

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish runtime
        uses: docker/build-push-action@v6
        with:
          context: .
          file: industrial-sentinel-runtime/Dockerfile
          push: true
          tags: |
            ghcr.io/industrial-platform-ai/industrial-sentinel-runtime:0.3.0
            ghcr.io/industrial-platform-ai/industrial-sentinel-runtime:latest
