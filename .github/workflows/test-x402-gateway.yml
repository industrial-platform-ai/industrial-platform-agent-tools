name: Test x402 Task Gateway

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'gateway/**'
      - '.github/workflows/test-x402-gateway.yml'
  pull_request:
    paths:
      - 'gateway/**'
      - '.github/workflows/test-x402-gateway.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      CDP_API_KEY_ID: ci-discovery-smoke-test
      CDP_API_KEY_SECRET: ci-discovery-smoke-test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install gateway dependencies
        run: npm install --prefix gateway --no-audit --no-fund
      - name: Boot gateway
        env:
          CDP_API_KEY_ID: ci-placeholder
          CDP_API_KEY_SECRET: ci-placeholder
        run: |
          cd gateway
          node --check server.mjs
          npm start > /tmp/gateway.log 2>&1 &
          echo $! > /tmp/gateway.pid
          for i in {1..20}; do
            curl -fsS http://127.0.0.1:3000/health && break
            sleep 0.25
          done
      - name: Verify discovery surfaces
        run: |
          set -euo pipefail
          curl -fsS http://127.0.0.1:3000/.well-known/x402 | tee /tmp/manifest.json
          curl -fsS http://127.0.0.1:3000/openapi.json | tee /tmp/openapi.json
          node <<'NODE'
          const fs=require('fs');
          const m=JSON.parse(fs.readFileSync('/tmp/manifest.json','utf8'));
          const o=JSON.parse(fs.readFileSync('/tmp/openapi.json','utf8'));
          if (!m.tools?.some(x=>x.route==='/metadata')) throw new Error('metadata missing');
          if (!m.tools?.some(x=>x.route==='/change')) throw new Error('change missing');
          if (!o.paths?.['/metadata']?.post) throw new Error('metadata OpenAPI missing');
          if (!o.paths?.['/change']?.post) throw new Error('change OpenAPI missing');
          NODE
      - name: Verify alternate Bazaar discovery probes
        run: |
          set -euo pipefail
          curl -fsS http://127.0.0.1:3000/payai/agent/wallet-monitor | tee /tmp/payai-probe.json
          curl -fsSI http://127.0.0.1:3000/goplausible/agent/transaction-watch >/dev/null
          node <<'NODE'
          const fs=require('fs');
          const probe=JSON.parse(fs.readFileSync('/tmp/payai-probe.json','utf8'));
          if (probe.status!=='available') throw new Error('PayAI route probe is not marked available');
          if (probe.method!=='POST') throw new Error('Probe must advertise POST as the paid method');
          if (probe.canonicalEndpoint!=='https://x402-gateway-production-1f21.up.railway.app/agent/wallet-monitor') {
            throw new Error('Canonical wallet-monitor endpoint missing');
          }
          if (probe.priceUsd!==0.005) throw new Error('Wallet-monitor price mismatch');
          if (!probe.inputSchema?.properties?.address) throw new Error('Wallet-monitor schema missing');
          NODE
      - name: Show log
        if: always()
        run: cat /tmp/gateway.log || true
