name: Test x402 Task Gateway

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'gateway/**'
      - '.github/workflows/test-x402-gateway.yml'
  push:
    branches: [main]
    paths:
      - 'gateway/**'
      - '.github/workflows/test-x402-gateway.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      CDP_API_KEY_ID: ci-discovery-smoke-test
      CDP_API_KEY_SECRET: ci-discovery-smoke-test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install gateway dependencies
        run: npm install --prefix gateway --no-audit --no-fund
      - name: Run gateway unit and syntax checks
        run: npm run check --prefix gateway
      - name: Generate ephemeral CI-only signing identity
        run: |
          node -e "const {generateKeyPairSync}=require('node:crypto'); const {privateKey}=generateKeyPairSync('ed25519'); process.stdout.write('AIMARKET_ED25519_PRIVATE_KEY_PEM_B64='+Buffer.from(privateKey.export({type:'pkcs8',format:'pem'})).toString('base64')+'\\n')" >> "$GITHUB_ENV"
      - name: Boot gateway
        env:
          CDP_API_KEY_ID: ci-placeholder
          CDP_API_KEY_SECRET: ci-placeholder
        run: |
          cd gateway
          node --check server.mjs
          npm start > /tmp/gateway.log 2>&1 &
          echo $! > /tmp/gateway.pid
          for i in {1..20}; do
            curl -fsS http://127.0.0.1:3000/health && break
            sleep 0.25
          done
      - name: Verify discovery surfaces
        run: |
          set -euo pipefail
          curl -fsS http://127.0.0.1:3000/.well-known/x402 | tee /tmp/manifest.json
          curl -fsS http://127.0.0.1:3000/openapi.json | tee /tmp/openapi.json
          node <<'NODE'
          const fs=require('fs');
          const m=JSON.parse(fs.readFileSync('/tmp/manifest.json','utf8'));
          const o=JSON.parse(fs.readFileSync('/tmp/openapi.json','utf8'));
          if (!m.tools?.some(x=>x.route==='/metadata')) throw new Error('metadata missing');
          if (!m.tools?.some(x=>x.route==='/change')) throw new Error('change missing');
          if (!o.paths?.['/metadata']?.post) throw new Error('metadata OpenAPI missing');
          if (!o.paths?.['/change']?.post) throw new Error('change OpenAPI missing');
          if (!o.paths?.['/commerce/payment-intent-assurance']?.post) throw new Error('payment-intent-assurance OpenAPI missing');
          if (!m.tools?.some(x=>x.route==='/commerce/payment-intent-assurance')) throw new Error('payment assurance x402 discovery missing');
          if (!m.tools?.some(x=>x.route==='/commerce/price-snapshot' && x.priceUsd===0.005)) throw new Error('PriceSignal route price/discovery missing');
          if (!o.paths?.['/commerce/price-snapshot']?.post) throw new Error('PriceSignal OpenAPI missing');
          NODE
      - name: Verify unpaid PriceSignal request is gated (no settlement)
        run: |
          set -euo pipefail
          code=$(curl -sS -o /tmp/pricesignal-response -D /tmp/pricesignal-headers -w '%{http_code}' -X POST 'http://127.0.0.1:3000/commerce/price-snapshot' -H 'Content-Type: application/json' --data '{"url":"https://example.com/"}')
          test "$code" = 402
          grep -qi '^payment-required:' /tmp/pricesignal-headers
          echo 'VERIFIED: PriceSignal unpaid POST requires x402; no USDC signed or spent'
      - name: Show log
        if: always()
        run: cat /tmp/gateway.log || true
