name: Inspect Web Change Actor

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/inspect-web-change-actor.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch sanitized Actor metadata
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
        run: |
          curl --fail-with-body --silent --show-error \
            --header "Authorization: Bearer $APIFY_TOKEN" \
            "https://api.apify.com/v2/actors/industrial_platform~web-change-intelligence" \
            > actor.json

          node <<'NODE'
          const fs = require('fs');
          const actor = JSON.parse(fs.readFileSync('actor.json', 'utf8')).data;
          const out = {
            id: actor.id,
            name: actor.name,
            username: actor.username,
            title: actor.title,
            isPublic: actor.isPublic,
            categories: actor.categories,
            defaultRunOptions: actor.defaultRunOptions,
            actorStandby: actor.actorStandby,
            pricingInfos: actor.pricingInfos,
            taggedBuilds: actor.taggedBuilds,
            createdAt: actor.createdAt,
            modifiedAt: actor.modifiedAt
          };
          console.log(JSON.stringify(out, null, 2));
          NODE
