name: Verify Machine Skill Discovery

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/verify-machine-skill-discovery.yml'

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/checkout@v4

      - name: Query skills.sh catalog
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p observability
          : > observability/machine-skill-discovery.txt
          for q in             'industrial platform paid web tools'             'web metadata extractor'             'website change detector'
          do
            echo "::group::skills.sh $q"
            code=$(curl --silent --show-error               -o body.json               -w '%{http_code}'               --get               --data-urlencode "q=$q"               --data-urlencode 'limit=20'               'https://skills.sh/api/v1/skills/search')
            echo "HTTP $code"
            cat body.json
            {
              echo "=== skills.sh :: $q :: HTTP $code ==="
              cat body.json
              echo
            } >> observability/machine-skill-discovery.txt
            echo
            echo "::endgroup::"
          done

      - name: Query AgentCash search
        shell: bash
        run: |
          set +e
          for q in             'web metadata extractor'             'website change detector'
          do
            echo "::group::agentcash $q"
            {
              echo "=== AgentCash :: $q ==="
              npx --yes agentcash@latest search "$q" --format pretty
              echo "exit=$?"
              echo
            } | tee -a observability/machine-skill-discovery.txt
            echo "::endgroup::"
          done
          exit 0

# recheck machine discovery after production x402 launch


      - name: Persist discovery snapshot
        shell: bash
        run: |
          git config user.name "industrial-platform-bot"
          git config user.email "art@naturalist.gallery"
          git add observability/machine-skill-discovery.txt
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Record machine skill discovery"
          git pull --rebase origin main
          git push
