name: Publish MCP Registry

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'server.json'
      - 'registry/*.json'
      - '.github/workflows/publish-mcp-registry.yml'

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        manifest:
          - server.json
          - registry/monitor-wallet.json
          - registry/transaction-watch.json
          - registry/treasury.json
          - registry/pretrade.json
          - registry/market-data.json
          - registry/web-monitor.json
    steps:
      - uses: actions/checkout@v4

      - name: Install MCP publisher
        run: |
          curl -L "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" | tar xz mcp-publisher
          chmod +x ./mcp-publisher

      - name: Validate registry metadata
        run: ./mcp-publisher validate ./${{ matrix.manifest }}

      - name: Authenticate with GitHub OIDC
        run: ./mcp-publisher login github-oidc --registry=https://registry.modelcontextprotocol.io

      - name: Publish registry entry
        run: ./mcp-publisher publish ./${{ matrix.manifest }}
