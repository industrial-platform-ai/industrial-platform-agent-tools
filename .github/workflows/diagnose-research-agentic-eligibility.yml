name: Diagnose Research Agentic Eligibility

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/diagnose-research-agentic-eligibility.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect public Store eligibility
        run: |
          node <<'NODE'
          const actorName = 'research-brief-agent';

          async function get(url) {
            const response = await fetch(url);
            const text = await response.text();
            if (!response.ok) throw new Error(response.status + ': ' + text.slice(0,1000));
            return JSON.parse(text);
          }

          const allUrl = new URL('https://api.apify.com/v2/store');
          allUrl.searchParams.set('search', actorName);
          allUrl.searchParams.set('username', 'industrial_platform');
          allUrl.searchParams.set('responseFormat', 'full');
          allUrl.searchParams.set('includeUnrunnableActors', 'true');

          const agenticUrl = new URL(allUrl);
          agenticUrl.searchParams.set('allowsAgenticUsers', 'true');

          const all = (await get(allUrl)).data?.items ?? [];
          const agentic = (await get(agenticUrl)).data?.items ?? [];

          const match = (items) => items.find(x => x.username === 'industrial_platform' && x.name === actorName);

          console.log(JSON.stringify({
            store: match(all) ?? null,
            agentic_store_match: match(agentic) ?? null
          }, null, 2));
          NODE

      - name: Inspect authenticated Actor execution configuration
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
        run: |
          curl --fail-with-body --silent --show-error             --header "Authorization: Bearer $APIFY_TOKEN"             "https://api.apify.com/v2/actors/industrial_platform~research-brief-agent"             > actor.json

          node <<'NODE'
          const fs = require('fs');
          const actor = JSON.parse(fs.readFileSync('actor.json','utf8')).data;
          const current = actor.pricingInfos?.[actor.pricingInfos.length - 1];
          console.log(JSON.stringify({
            id: actor.id,
            name: actor.name,
            isPublic: actor.isPublic,
            defaultRunOptions: actor.defaultRunOptions,
            actorStandby: actor.actorStandby,
            currentPricingInfo: current,
            taggedBuilds: actor.taggedBuilds
          }, null, 2));
          NODE

      - name: Probe all six Skyfire challenges without spending
        run: |
          node <<'NODE'
          const actors = [
            'industrial_platform~research-brief-agent',
            'industrial_platform~web-change-intelligence',
            'industrial_platform~web-metadata-intelligence',
            'industrial_platform~article-content-intelligence',
            'industrial_platform~pdf-text-intelligence',
            'industrial_platform~sitemap-intelligence'
          ];

          const rows = [];
          for (const actor of actors) {
            const response = await fetch(
              `https://api.apify.com/v2/actors/${actor}/run-sync-get-dataset-items`,
              {
                method: 'GET',
                headers: {
                  'X-APIFY-PAYMENT-PROTOCOL': 'SKYFIRE',
                  Accept: 'application/json'
                },
                redirect: 'manual'
              }
            );
            const text = await response.text();
            let body;
            try { body = JSON.parse(text); }
            catch { body = { raw: text.slice(0,500) }; }
            rows.push({
              actor,
              status: response.status,
              error_type: body?.error?.type ?? null,
              error_message: body?.error?.message ?? null
            });
          }
          console.log(JSON.stringify(rows, null, 2));
          NODE
