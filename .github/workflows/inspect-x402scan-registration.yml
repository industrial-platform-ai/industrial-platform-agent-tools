name: Inspect x402scan Registration State
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/inspect-x402scan-registration.yml'
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch buyer state
        run: |
          mkdir -p observability
          curl -fsS https://x402-seed-buyer-production.up.railway.app/state             -o observability/x402scan-registration-state.json
          cat observability/x402scan-registration-state.json
      - name: Persist state
        run: |
          git config user.name "industrial-platform-bot"
          git config user.email "art@naturalist.gallery"
          git add observability/x402scan-registration-state.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Record x402scan registration state"
          git pull --rebase origin main
          git push
