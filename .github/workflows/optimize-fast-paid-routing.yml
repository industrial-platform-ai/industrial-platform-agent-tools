name: Optimize Fast Paid Routing

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/optimize-fast-paid-routing.yml'

permissions:
  contents: read

jobs:
  optimize:
    runs-on: ubuntu-latest
    steps:
      - name: Apply acquisition pricing only
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
        run: |
          set -euo pipefail

          update_price() {
            local actor="$1"
            local event="$2"
            local event_title="$3"
            local event_description="$4"

            cat > payload.json <<JSON
          {
            "pricingInfos": [{
              "pricingModel": "PAY_PER_EVENT",
              "pricingPerEvent": {
                "actorChargeEvents": {
                  "$event": {
                    "eventTitle": "$event_title",
                    "eventDescription": "$event_description",
                    "eventPriceUsd": 0.001,
                    "isPrimaryEvent": true,
                    "isOneTimeEvent": false
                  }
                }
              }
            }]
          }
          JSON

            code=$(curl --silent --show-error               -o response.json               -w '%{http_code}'               --request PUT               --header "Authorization: Bearer $APIFY_TOKEN"               --header "Content-Type: application/json"               --data @payload.json               "https://api.apify.com/v2/actors/$actor")

            echo "$actor HTTP $code"
            cat response.json
            echo

            if [[ "$code" -lt 200 || "$code" -ge 300 ]]; then
              echo "::error::$actor pricing update failed with HTTP $code"
              return 1
            fi

            node - "$actor" "$event" <<'NODE'
          const fs = require('fs');
          const actorName = process.argv[2];
          const eventName = process.argv[3];
          const actor = JSON.parse(fs.readFileSync('response.json','utf8')).data;
          const pricing = actor.pricingInfos?.[actor.pricingInfos.length - 1];
          const charge = pricing?.pricingPerEvent?.actorChargeEvents?.[eventName];
          console.log(JSON.stringify({
            actor: actorName,
            isPublic: actor.isPublic,
            pricingModel: pricing?.pricingModel,
            eventPriceUsd: charge?.eventPriceUsd,
            isPrimaryEvent: charge?.isPrimaryEvent,
            permission: actor.defaultRunOptions?.forcePermissionLevel,
            standby: actor.actorStandby?.isEnabled,
            agenticWhitelist: actor.isWhiteListedForAgenticPayments
          }, null, 2));
          if (charge?.eventPriceUsd !== 0.001) throw new Error('price did not become $0.001');
          NODE
          }

          update_price             'industrial_platform~web-metadata-intelligence'             'metadata-extraction'             'Metadata extraction'             'One successful public URL metadata extraction.'

          update_price             'industrial_platform~web-change-intelligence'             'page-comparison'             'Page comparison'             'One successful public webpage baseline or comparison.'

      - name: Verify Store agentic visibility
        run: |
          set -euo pipefail
          for actor in web-metadata-intelligence web-change-intelligence; do
            curl --fail-with-body --silent --show-error               "https://api.apify.com/v2/store?search=$actor&username=industrial_platform&responseFormat=full&allowsAgenticUsers=true&includeUnrunnableActors=true"               > store.json

            node - "$actor" <<'NODE'
          const fs = require('fs');
          const name = process.argv[2];
          const items = JSON.parse(fs.readFileSync('store.json','utf8')).data?.items ?? [];
          const actor = items.find(x => x.username === 'industrial_platform' && x.name === name);
          console.log(JSON.stringify({
            actor: name,
            foundAgentic: Boolean(actor),
            currentPricingInfo: actor?.currentPricingInfo,
            isWhiteListedForAgenticPayments: actor?.isWhiteListedForAgenticPayments
          }, null, 2));
          if (!actor) throw new Error(name + ' is not visible with allowsAgenticUsers=true');
          NODE
          done
