name: Deploy Web Change Intelligence

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'actors/web-change-intelligence/**'
      - '.github/workflows/deploy-web-change-intelligence.yml'

concurrency:
  group: industrial-platform-apify-build-lane-1
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  test-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Actor dependencies
        working-directory: actors/web-change-intelligence
        run: npm install
      - name: Run Actor checks
        working-directory: actors/web-change-intelligence
        run: |
          npm run check
          npm test
      - name: Push and build Actor on Apify
        id: push
        uses: apify/push-actor-action@v1
        with:
          token: ${{ secrets.APIFY_TOKEN }}
          working-directory: ${{ github.workspace }}/actors/web-change-intelligence
      - name: Smoke test deployed Actor
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
        run: |
          curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Authorization: Bearer $APIFY_TOKEN" \
            --header "Content-Type: application/json" \
            --data '{"url":"https://example.com/","include_current_text":false}' \
            "https://api.apify.com/v2/actors/industrial_platform~web-change-intelligence/run-sync-get-dataset-items?clean=true&format=json&timeout=60" \
            > smoke-result.json
          node <<'NODE'
          const fs = require('fs');
          const parsed = JSON.parse(fs.readFileSync('smoke-result.json', 'utf8'));
          if (!Array.isArray(parsed) || parsed.length !== 1) throw new Error('Smoke test did not return exactly one dataset item.');
          const result = parsed[0];
          if (result.status !== 'ready') throw new Error(`Smoke test status was ${result.status}`);
          if (!result.current_hash || result.comparison_status !== 'baseline') throw new Error('Smoke test did not return a valid baseline fingerprint.');
          console.log(JSON.stringify({
            status: result.status,
            comparison_status: result.comparison_status,
            current_hash: result.current_hash,
            final_url: result.final_url
          }, null, 2));
          NODE
      - name: Deployment summary
        run: |
          {
            echo "## Web Change Intelligence deployed"
            echo ""
            echo "- Build ID: ${{ steps.push.outputs.build-id }}"
            echo "- Build number: ${{ steps.push.outputs.build-number }}"
            echo "- Build status: ${{ steps.push.outputs.build-status }}"
            echo "- Smoke test: passed"
          } >> "$GITHUB_STEP_SUMMARY"
