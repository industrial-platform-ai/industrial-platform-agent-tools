name: Deploy Link Intelligence

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'actors/link-intelligence/**'
      - '.github/workflows/deploy-link-intelligence.yml'

concurrency:
  group: industrial-platform-apify-build-lane-5
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        working-directory: actors/link-intelligence
        run: npm install

      - name: Run checks
        working-directory: actors/link-intelligence
        run: |
          npm run check
          npm test

      - name: Push and build Actor on Apify
        uses: apify/push-actor-action@v1
        with:
          token: ${{ secrets.APIFY_TOKEN }}
          working-directory: ${{ github.workspace }}/actors/link-intelligence

      - name: Publication ownership
        run: |
          echo "Build deployment completed."
          echo "Public/PPE reconciliation is handled by Reconcile Link Intelligence Publication."
          echo "This keeps Apify's daily Actor-publication quota from turning code deployment into a false failure."
