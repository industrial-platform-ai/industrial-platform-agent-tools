name: Integration providers

on:
  push:
    paths:
      - "integrations/agentkit-industrial-platform/**"
      - "integrations/aws-agentcore-industrial-platform/**"
      - ".github/workflows/integration-providers.yml"
  pull_request:
    paths:
      - "integrations/agentkit-industrial-platform/**"
      - "integrations/aws-agentcore-industrial-platform/**"
      - ".github/workflows/integration-providers.yml"

jobs:
  agentkit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: integrations/agentkit-industrial-platform
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --no-audit --no-fund
      - name: Inspect published AgentKit compatibility
        run: |
          node -e "const p=require('@coinbase/agentkit/package.json'); console.log('agentkit',p.version,'zod',p.dependencies?.zod)"
          grep -R "declare function x402ActionProvider\|class X402ActionProvider" node_modules/@coinbase/agentkit/dist -n | head -20 || true
      - run: npm run check
      - run: npm run build

  agentcore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m py_compile integrations/aws-agentcore-industrial-platform/install.py integrations/aws-agentcore-industrial-platform/payment_example.py
