name: Monetize and Publish Web Metadata Intelligence

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/monetize-publish-web-metadata.yml'

permissions:
  contents: read

jobs:
  monetize-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Configure PPE pricing and publish
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
        run: |
          cat > pricing.json <<'JSON'
          {
            "pricingInfos": [
              {
                "pricingModel": "PAY_PER_EVENT",
                "pricingPerEvent": {
                  "actorChargeEvents": {
                    "metadata-extraction": {
                      "eventTitle": "Metadata extraction",
                      "eventDescription": "One successful public URL metadata extraction.",
                      "eventPriceUsd": 0.01,
                      "isPrimaryEvent": true,
                      "isOneTimeEvent": false
                    }
                  }
                }
              }
            ],
            "isPublic": true,
            "title": "Web Metadata Intelligence",
            "categories": ["AI"]
          }
          JSON
          curl --fail-with-body --silent --show-error \
            --request PUT \
            --header "Authorization: Bearer $APIFY_TOKEN" \
            --header "Content-Type: application/json" \
            --data @pricing.json \
            "https://api.apify.com/v2/actors/industrial_platform~web-metadata-intelligence" \
            > actor.json
          node <<'NODE'
          const fs = require('fs');
          const actor = JSON.parse(fs.readFileSync('actor.json','utf8')).data;
          const current = actor.pricingInfos?.[actor.pricingInfos.length - 1];
          const event = current?.pricingPerEvent?.actorChargeEvents?.['metadata-extraction'];
          console.log(JSON.stringify({
            isPublic: actor.isPublic,
            pricingModel: current?.pricingModel,
            eventPriceUsd: event?.eventPriceUsd,
            primaryEvent: event?.isPrimaryEvent
          }, null, 2));
          if (!actor.isPublic) throw new Error('Actor is not public.');
          if (current?.pricingModel !== 'PAY_PER_EVENT') throw new Error('Actor is not PPE.');
          if (!event?.isPrimaryEvent) throw new Error('Primary event not configured.');
          NODE
