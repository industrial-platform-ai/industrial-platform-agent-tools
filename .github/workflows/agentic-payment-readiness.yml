name: Agentic Payment Readiness

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/agentic-payment-readiness.yml'
  schedule:
    - cron: '23 */6 * * *'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify Store agentic eligibility for all services
        run: |
          node <<'NODE'
          const names = [
            'research-brief-agent',
            'web-change-intelligence',
            'web-metadata-intelligence',
            'article-content-intelligence',
            'pdf-text-intelligence',
            'sitemap-intelligence'
          ];

          const rows = [];

          for (const name of names) {
            const url = new URL('https://api.apify.com/v2/store');
            url.searchParams.set('search', name);
            url.searchParams.set('username', 'industrial_platform');
            url.searchParams.set('responseFormat', 'full');
            url.searchParams.set('allowsAgenticUsers', 'true');
            url.searchParams.set('includeUnrunnableActors', 'true');

            const response = await fetch(url);
            if (!response.ok) throw new Error(name + ': Store HTTP ' + response.status);
            const items = (await response.json()).data?.items ?? [];
            const actor = items.find(x => x.username === 'industrial_platform' && x.name === name);

            if (!actor) throw new Error(name + ': missing from allowsAgenticUsers=true Store results');
            if (!actor.isWhiteListedForAgenticPayments) {
              throw new Error(name + ': agentic-payment whitelist is false');
            }
            if (actor.currentPricingInfo?.pricingModel !== 'PAY_PER_EVENT') {
              throw new Error(name + ': expected PAY_PER_EVENT');
            }

            rows.push({
              actor: 'industrial_platform/' + name,
              whitelisted: actor.isWhiteListedForAgenticPayments,
              pricingModel: actor.currentPricingInfo?.pricingModel,
              primaryEvents: actor.currentPricingInfo?.pricingPerEvent?.actorChargeEvents ?? null
            });
          }

          console.log(JSON.stringify(rows, null, 2));
          NODE

      - name: Inspect MCP payment-mode discovery
        run: |
          npm install --no-save @modelcontextprotocol/sdk

          node <<'NODE'
          const { Client } = await import('@modelcontextprotocol/sdk/client/index.js');
          const { StreamableHTTPClientTransport } = await import('@modelcontextprotocol/sdk/client/streamableHttp.js');

          const actors = [
            'industrial_platform/research-brief-agent',
            'industrial_platform/web-change-intelligence',
            'industrial_platform/web-metadata-intelligence',
            'industrial_platform/article-content-intelligence',
            'industrial_platform/pdf-text-intelligence',
            'industrial_platform/sitemap-intelligence'
          ];

          const modes = ['skyfire', 'x402'];
          const reports = [];

          for (const mode of modes) {
            const endpoint = new URL('https://mcp.apify.com/');
            endpoint.searchParams.set('tools', actors.join(','));
            endpoint.searchParams.set('payment', mode);

            const client = new Client(
              { name: 'industrial-platform-' + mode + '-readiness', version: '1.0.0' },
              {}
            );
            const transport = new StreamableHTTPClientTransport(endpoint);

            try {
              await client.connect(transport);
              const { tools } = await client.listTools();

              const serviceTools = tools.filter((tool) =>
                actors.some((actor) => tool.name.includes(actor.split('/')[1]))
              );

              const rows = serviceTools.map((tool) => ({
                name: tool.name,
                required: tool.inputSchema?.required ?? [],
                properties: Object.keys(tool.inputSchema?.properties ?? {}),
                paymentProperties: Object.keys(tool.inputSchema?.properties ?? {})
                  .filter((key) => /pay|skyfire|payment|x402/i.test(key)),
                description: tool.description
              }));

              if (rows.length !== actors.length) {
                throw new Error(mode + ': expected ' + actors.length + ' service tools, found ' + rows.length);
              }

              reports.push({
                mode,
                endpoint: endpoint.toString(),
                service_tool_count: rows.length,
                tools: rows
              });
            } finally {
              await client.close().catch(() => {});
            }
          }

          console.log(JSON.stringify(reports, null, 2));
          NODE

      - name: Record API challenge behavior without asserting it
        run: |
          node <<'NODE'
          const actors = [
            'industrial_platform~research-brief-agent',
            'industrial_platform~web-change-intelligence',
            'industrial_platform~web-metadata-intelligence',
            'industrial_platform~article-content-intelligence',
            'industrial_platform~pdf-text-intelligence',
            'industrial_platform~sitemap-intelligence'
          ];

          const rows = [];
          for (const actor of actors) {
            const response = await fetch(
              'https://api.apify.com/v2/actors/' + actor + '/run-sync-get-dataset-items',
              {
                method: 'GET',
                headers: {
                  'X-APIFY-PAYMENT-PROTOCOL': 'SKYFIRE',
                  Accept: 'application/json'
                },
                redirect: 'manual'
              }
            );
            const text = await response.text();
            let body;
            try { body = JSON.parse(text); }
            catch { body = {}; }

            rows.push({
              actor,
              status: response.status,
              error_type: body?.error?.type ?? null,
              error_message: body?.error?.message ?? null
            });
          }

          console.log(JSON.stringify({
            note: 'Observed only; production API currently returns 401 on this GET probe for all portfolio Actors.',
            rows
          }, null, 2));
          NODE
