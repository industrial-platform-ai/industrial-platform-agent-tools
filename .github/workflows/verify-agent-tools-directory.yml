name: Verify Agent Tools Directory Discovery

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/verify-agent-tools-directory.yml'
  schedule:
    - cron: '13 */6 * * *'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Verify MCP directory listings
        run: |
          set -euo pipefail

          node <<'NODE'
          const expected = [
            'industrial-platform-paid-agent-web-tools',
            'industrial-platform-article-content-extractor',
            'industrial-platform-pdf-text-extractor',
            'industrial-platform-sitemap-url-extractor',
            'industrial-platform-web-metadata-extractor'
          ];

          const details = [];
          for (const slug of expected) {
            const response = await fetch('https://agent-tools.cloud/api/v1/mcp/servers/' + slug);
            const text = await response.text();
            let body;
            try { body = JSON.parse(text); } catch { body = { raw: text }; }
            details.push({
              slug,
              status: response.status,
              name: body.name ?? null,
              endpoint_url: body.endpoint_url ?? null,
              health: body.health ?? null,
              x402_supported: body.x402_supported ?? null
            });
            if (!response.ok) throw new Error(slug + ': detail endpoint HTTP ' + response.status);
          }

          console.log(JSON.stringify({ listed: details }, null, 2));

          const search = new URL('https://agent-tools.cloud/api/v1/mcp/search');
          search.searchParams.set('q', 'Industrial Platform');
          search.searchParams.set('limit', '100');
          const searchResponse = await fetch(search);
          if (!searchResponse.ok) throw new Error('Directory search HTTP ' + searchResponse.status);
          const searchBody = await searchResponse.json();
          const servers = searchBody.servers ?? [];
          const ranked = details.map((entry) => ({
            slug: entry.slug,
            rank: servers.findIndex(s => s.slug === entry.slug) + 1 || null
          }));
          console.log(JSON.stringify({
            query: 'Industrial Platform',
            total_matched: searchBody.total_matched,
            ranks: ranked
          }, null, 2));
          NODE

      - name: Record broker behavior
        run: |
          curl --fail-with-body --silent --show-error --get             --data-urlencode "q=extract article text for RAG"             --data-urlencode "max_price_usd=0.01"             --data-urlencode "limit=10"             "https://agent-tools.cloud/api/v1/broker/recommend" > broker.json

          node <<'NODE'
          const fs = require('fs');
          const body = JSON.parse(fs.readFileSync('broker.json','utf8'));
          console.log(JSON.stringify({
            note: 'Agent Tools broker only ranks endpoints it independently verifies as bare-HTTP x402. Apify MCP payment negotiation is tool-invocation based, so MCP directory visibility and broker x402 recognition are separate.',
            broker: body
          }, null, 2));
          NODE
