name: Deploy Sitemap Intelligence

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'actors/sitemap-intelligence/**'
      - '.github/workflows/deploy-sitemap-intelligence.yml'

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        working-directory: actors/sitemap-intelligence
        run: npm install

      - name: Run checks
        working-directory: actors/sitemap-intelligence
        run: |
          npm run check
          npm test

      - name: Push and build Actor on Apify
        uses: apify/push-actor-action@v1
        with:
          token: ${{ secrets.APIFY_TOKEN }}
          working-directory: ${{ github.workspace }}/actors/sitemap-intelligence

      - name: Configure runtime, pricing, and publication
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
        run: |
          cat > payload.json <<'JSON'
          {
            "title": "Sitemap Intelligence",
            "description": "Discover website sitemaps and extract clean deduplicated URL rows for AI agents, crawlers, RAG pipelines, SEO tools, and automation. Supports robots.txt discovery, sitemap indexes, XML, gzip, RSS, Atom, and plain-text sitemaps.",
            "categories": ["AI", "DEVELOPER_TOOLS", "SEO_TOOLS"],
            "isPublic": true,
            "defaultRunOptions": {
              "build": "latest",
              "timeoutSecs": 240,
              "memoryMbytes": 512,
              "restartOnError": false,
              "forcePermissionLevel": "LIMITED_PERMISSIONS"
            },
            "actorStandby": { "isEnabled": false },
            "exampleRunInput": {
              "body": "{\"start_urls\":[\"https://www.w3.org\"]}",
              "contentType": "application/json; charset=utf-8"
            }
          }
          JSON

          curl --fail-with-body --silent --show-error \
            --request PUT \
            --header "Authorization: Bearer $APIFY_TOKEN" \
            --header "Content-Type: application/json" \
            --data @payload.json \
            "https://api.apify.com/v2/actors/industrial_platform~sitemap-intelligence" \
            > actor-runtime.json

          curl --fail-with-body --silent --show-error \
            --header "Authorization: Bearer $APIFY_TOKEN" \
            "https://api.apify.com/v2/actors/industrial_platform~sitemap-intelligence" \
            > current-actor.json

          node <<'NODE'
          const fs = require('fs');
          const actor = JSON.parse(fs.readFileSync('current-actor.json','utf8')).data;
          const current = actor.pricingInfos?.[actor.pricingInfos.length - 1];
          const currentEvent = current?.pricingPerEvent?.actorChargeEvents?.['sitemap-url'];

          const pricingCorrect =
            current?.pricingModel === 'PAY_PER_EVENT' &&
            currentEvent?.eventPriceUsd === 0.0001 &&
            currentEvent?.isPrimaryEvent === true;

          if (!pricingCorrect) {
            fs.writeFileSync('pricing.json', JSON.stringify({
              pricingInfos: [{
                pricingModel: 'PAY_PER_EVENT',
                pricingPerEvent: {
                  actorChargeEvents: {
                    'sitemap-url': {
                      eventTitle: 'Sitemap URL',
                      eventDescription: 'One unique URL emitted from a sitemap.',
                      eventPriceUsd: 0.0001,
                      isPrimaryEvent: true,
                      isOneTimeEvent: false
                    }
                  }
                }
              }]
            }));
          }

          fs.writeFileSync('pricing-needed.txt', pricingCorrect ? 'false' : 'true');
          NODE

          if [ "$(cat pricing-needed.txt)" = "true" ]; then
            curl --fail-with-body --silent --show-error \
              --request PUT \
              --header "Authorization: Bearer $APIFY_TOKEN" \
              --header "Content-Type: application/json" \
              --data @pricing.json \
              "https://api.apify.com/v2/actors/industrial_platform~sitemap-intelligence" \
              > actor-pricing.json
          fi

      - name: Verify configuration
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
        run: |
          curl --fail-with-body --silent --show-error \
            --header "Authorization: Bearer $APIFY_TOKEN" \
            "https://api.apify.com/v2/actors/industrial_platform~sitemap-intelligence" \
            > actor.json

          node <<'NODE'
          const fs = require('fs');
          const actor = JSON.parse(fs.readFileSync('actor.json','utf8')).data;
          const current = actor.pricingInfos?.[actor.pricingInfos.length - 1];
          const event = current?.pricingPerEvent?.actorChargeEvents?.['sitemap-url'];
          if (!actor.isPublic) throw new Error('Actor is not public.');
          if (actor.defaultRunOptions?.forcePermissionLevel !== 'LIMITED_PERMISSIONS') throw new Error('Actor is not limited-permissions.');
          if (actor.actorStandby?.isEnabled) throw new Error('Standby must be disabled.');
          if (current?.pricingModel !== 'PAY_PER_EVENT') throw new Error('Actor is not PPE.');
          if (event?.eventPriceUsd !== 0.0001) throw new Error('Unexpected sitemap-url price.');
          console.log(JSON.stringify({
            isPublic: actor.isPublic,
            pricingModel: current?.pricingModel,
            eventPriceUsd: event?.eventPriceUsd
          }, null, 2));
          NODE

      - name: Smoke test
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
        run: |
          curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Authorization: Bearer $APIFY_TOKEN" \
            --header "Content-Type: application/json" \
            --data '{"start_urls":["https://www.w3.org/sitemap.xml"],"max_urls":25}' \
            "https://api.apify.com/v2/actors/industrial_platform~sitemap-intelligence/run-sync-get-dataset-items?clean=true&format=json&timeout=90" \
            > result.json

          node <<'NODE'
          const fs = require('fs');
          const rows = JSON.parse(fs.readFileSync('result.json', 'utf8'));
          if (!Array.isArray(rows)) throw new Error('Expected dataset array.');
          if (rows.length < 1) throw new Error('Smoke test returned no sitemap URLs.');
          if (!rows[0].url) throw new Error('Smoke test row has no URL.');
          console.log(JSON.stringify({
            rows: rows.length,
            sample: rows[0]
          }, null, 2));
          NODE
