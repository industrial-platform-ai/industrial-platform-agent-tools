name: Agent Hansa Live Runtime Outreach

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/agenthansa-live-runtime-outreach-v2.yml"
      - "scripts/agenthansa_live_outreach.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  outreach:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Qualify live Agent Hansa runtime candidates
        run: python scripts/agenthansa_live_outreach.py
