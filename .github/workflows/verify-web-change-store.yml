name: Verify Web Change Store Eligibility

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/verify-web-change-store.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check Store visibility and agentic eligibility
        run: |
          curl --fail-with-body --silent --show-error \
            "https://api.apify.com/v2/store?search=web-change-intelligence&username=industrial_platform&responseFormat=full&includeUnrunnableActors=true" \
            > store-all.json

          curl --fail-with-body --silent --show-error \
            "https://api.apify.com/v2/store?search=web-change-intelligence&username=industrial_platform&responseFormat=full&includeUnrunnableActors=false" \
            > store-runnable.json

          curl --fail-with-body --silent --show-error \
            "https://api.apify.com/v2/store?search=web-change-intelligence&username=industrial_platform&responseFormat=full&allowsAgenticUsers=true&includeUnrunnableActors=true" \
            > store-agentic.json

          node <<'NODE'
          const fs = require('fs');
          const read = (p) => JSON.parse(fs.readFileSync(p, 'utf8')).data?.items ?? [];
          const all = read('store-all.json');
          const runnable = read('store-runnable.json');
          const agentic = read('store-agentic.json');

          const actor = all.find((x) => x.username === 'industrial_platform' && x.name === 'web-change-intelligence');
          const runnableActor = runnable.find((x) => x.username === 'industrial_platform' && x.name === 'web-change-intelligence');
          const agenticActor = agentic.find((x) => x.username === 'industrial_platform' && x.name === 'web-change-intelligence');

          console.log(JSON.stringify({
            found_in_store: Boolean(actor),
            found_in_runnable_store: Boolean(runnableActor),
            found_with_allowsAgenticUsers_true: Boolean(agenticActor),
            actor: actor ? {
              id: actor.id,
              title: actor.title,
              name: actor.name,
              username: actor.username,
              categories: actor.categories,
              currentPricingInfo: actor.currentPricingInfo,
              isWhiteListedForAgenticPayments: actor.isWhiteListedForAgenticPayments,
              stats: actor.stats
            } : null
          }, null, 2));

          if (!actor) process.exitCode = 2;
          NODE
