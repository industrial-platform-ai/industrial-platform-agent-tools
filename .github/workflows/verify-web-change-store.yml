name: Verify Web Change Store Eligibility

on:
  workflow_dispatch:
  schedule:
    - cron: '23 * * * *'
  push:
    branches: [main]
    paths:
      - '.github/workflows/verify-web-change-store.yml'

permissions:
  contents: read
  issues: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check Store visibility and agentic eligibility
        id: store
        run: |
          curl --fail-with-body --silent --show-error \
            "https://api.apify.com/v2/store?search=web-change-intelligence&username=industrial_platform&responseFormat=full&includeUnrunnableActors=true" \
            > store-all.json

          curl --fail-with-body --silent --show-error \
            "https://api.apify.com/v2/store?search=web-change-intelligence&username=industrial_platform&responseFormat=full&includeUnrunnableActors=false" \
            > store-runnable.json

          curl --fail-with-body --silent --show-error \
            "https://api.apify.com/v2/store?search=web-change-intelligence&username=industrial_platform&responseFormat=full&allowsAgenticUsers=true&includeUnrunnableActors=true" \
            > store-agentic.json

          node <<'NODE'
          const fs = require('fs');
          const read = (p) => JSON.parse(fs.readFileSync(p, 'utf8')).data?.items ?? [];
          const all = read('store-all.json');
          const runnable = read('store-runnable.json');
          const agentic = read('store-agentic.json');

          const match = (x) => x.username === 'industrial_platform' && x.name === 'web-change-intelligence';
          const actor = all.find(match);
          const runnableActor = runnable.find(match);
          const agenticActor = agentic.find(match);

          const result = {
            found_in_store: Boolean(actor),
            found_in_runnable_store: Boolean(runnableActor),
            found_with_allowsAgenticUsers_true: Boolean(agenticActor),
            actor: actor ? {
              id: actor.id,
              title: actor.title,
              name: actor.name,
              username: actor.username,
              categories: actor.categories,
              currentPricingInfo: actor.currentPricingInfo,
              isWhiteListedForAgenticPayments: actor.isWhiteListedForAgenticPayments,
              stats: actor.stats
            } : null,
            checked_at: new Date().toISOString()
          };

          console.log(JSON.stringify(result, null, 2));
          fs.appendFileSync(process.env.GITHUB_OUTPUT, [
            `found_in_store=${result.found_in_store}`,
            `found_in_runnable_store=${result.found_in_runnable_store}`,
            `found_agentic=${result.found_with_allowsAgenticUsers_true}`
          ].join('\n') + '\n');
          NODE

      - name: Create agentic eligibility milestone issue
        if: steps.store.outputs.found_agentic == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const title = 'Distribution milestone: Web Change Intelligence is agentic-payment eligible';
            const existing = await github.paginate(github.rest.issues.listForRepo, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'all',
              per_page: 100
            });
            if (existing.some((issue) => issue.title === title)) return;

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body: [
                'Apify Store discovery now returns **industrial_platform/web-change-intelligence** when queried with `allowsAgenticUsers=true`.',
                '',
                'The Actor is now technically available for agentic discovery/payment under Apify\'s current Store API.',
                '',
                'Next objective: first external paid `page-comparison` event.'
              ].join('\n')
            });
