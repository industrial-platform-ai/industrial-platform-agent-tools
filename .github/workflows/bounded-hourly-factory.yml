# FROZEN by operator directive: no service-definition generation, new routes, or child replicas.
# Existing 85 x402-paid HTTP routes remain unchanged and available.
# To restore service generation requires an explicit subsequent authorization and review.
name: Industrial Platform Factory — Frozen
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  confirm-freeze:
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - run: |
          echo "Factory frozen: no scheduled jobs, child generation, promotion, or route creation."
          echo "Operational priority: discovery, legitimate registration and integration of existing routes."
