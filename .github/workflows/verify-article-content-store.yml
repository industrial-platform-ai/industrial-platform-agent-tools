name: Verify Article Content Store Eligibility

on:
  workflow_dispatch:
  schedule:
    - cron: '49 * * * *'

permissions:
  contents: read
  issues: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check Store and agentic eligibility
        id: check
        run: |
          curl --fail-with-body --silent --show-error \
            "https://api.apify.com/v2/store?search=article-content-intelligence&username=industrial_platform&responseFormat=full&allowsAgenticUsers=true&includeUnrunnableActors=true" \
            > store.json
          node <<'NODE'
          const fs = require('fs');
          const items = JSON.parse(fs.readFileSync('store.json','utf8')).data?.items ?? [];
          const actor = items.find(x => x.username === 'industrial_platform' && x.name === 'article-content-intelligence');
          const found = Boolean(actor);
          console.log(JSON.stringify({ found_agentic: found, actor }, null, 2));
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `found_agentic=${found}\n`);
          NODE
      - name: Create distribution milestone
        if: steps.check.outputs.found_agentic == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const title = 'Distribution milestone: Article Content Intelligence is agentic-payment eligible';
            const existing = await github.paginate(github.rest.issues.listForRepo, {
              owner: context.repo.owner, repo: context.repo.repo, state: 'all', per_page: 100
            });
            if (existing.some(i => i.title === title)) return;
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body: 'Apify Store now returns **industrial_platform/article-content-intelligence** with `allowsAgenticUsers=true`. Next objective: first external paid `article-extraction` event.'
            });
