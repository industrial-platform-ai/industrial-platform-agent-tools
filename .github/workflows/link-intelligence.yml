name: Link Intelligence

on:
  pull_request:
    paths:
      - 'actors/link-intelligence/**'
      - '.github/workflows/link-intelligence.yml'
  push:
    branches: [main]
    paths:
      - 'actors/link-intelligence/**'
      - '.github/workflows/link-intelligence.yml'

permissions:
  contents: read

jobs:
  actor:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: actors/link-intelligence
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - run: npm run check
      - run: npm test
