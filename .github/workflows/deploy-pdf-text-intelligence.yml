name: Deploy PDF Text Intelligence

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'actors/pdf-text-intelligence/**'
      - '.github/workflows/deploy-pdf-text-intelligence.yml'

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        working-directory: actors/pdf-text-intelligence
        run: npm install

      - name: Run checks
        working-directory: actors/pdf-text-intelligence
        run: |
          npm run check
          npm test

      - name: Push and build Actor on Apify
        id: push
        uses: apify/push-actor-action@v1
        with:
          token: ${{ secrets.APIFY_TOKEN }}
          working-directory: ${{ github.workspace }}/actors/pdf-text-intelligence

      - name: Configure runtime, pricing, and publication
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
        run: |
          curl --fail-with-body --silent --show-error \
            --header "Authorization: Bearer $APIFY_TOKEN" \
            "https://api.apify.com/v2/actors/industrial_platform~pdf-text-intelligence" \
            > current-actor.json

          node <<'NODE'
          const fs = require('fs');
          const actor = JSON.parse(fs.readFileSync('current-actor.json','utf8')).data;
          const current = actor.pricingInfos?.[actor.pricingInfos.length - 1];
          const currentEvent = current?.pricingPerEvent?.actorChargeEvents?.['pdf-extraction'];

          const payload = {
            title: 'PDF Text Intelligence',
            description: 'Extract full text, per-page text, and PDF metadata from public PDFs for AI agents, RAG pipelines, research workflows, and automation without per-run LLM cost.',
            categories: ['AI'],
            isPublic: true,
            defaultRunOptions: {
              build: 'latest',
              timeoutSecs: 240,
              memoryMbytes: 1024,
              restartOnError: false,
              forcePermissionLevel: 'LIMITED_PERMISSIONS'
            },
            actorStandby: { isEnabled: false },
            exampleRunInput: {
              body: JSON.stringify({ urls: ['https://www.w3.org/WAI/ER/tests/xhtml/testfiles/resources/pdf/dummy.pdf'] }),
              contentType: 'application/json; charset=utf-8'
            }
          };

          const pricingCorrect =
            current?.pricingModel === 'PAY_PER_EVENT' &&
            currentEvent?.eventPriceUsd === 0.0015 &&
            currentEvent?.isPrimaryEvent === true;

          if (!pricingCorrect) {
            payload.pricingInfos = [{
              pricingModel: 'PAY_PER_EVENT',
              pricingPerEvent: {
                actorChargeEvents: {
                  'pdf-extraction': {
                    eventTitle: 'PDF extraction',
                    eventDescription: 'One successful PDF text and metadata extraction.',
                    eventPriceUsd: 0.0015,
                    isPrimaryEvent: true,
                    isOneTimeEvent: false
                  }
                }
              }
            }];
          }

          fs.writeFileSync('payload.json', JSON.stringify(payload));
          console.log(JSON.stringify({ pricingCorrect, pricingUpdateNeeded: !pricingCorrect }, null, 2));
          NODE

          curl --fail-with-body --silent --show-error \
            --request PUT \
            --header "Authorization: Bearer $APIFY_TOKEN" \
            --header "Content-Type: application/json" \
            --data @payload.json \
            "https://api.apify.com/v2/actors/industrial_platform~pdf-text-intelligence" \
            > actor.json

          node <<'NODE'
          const fs = require('fs');
          const actor = JSON.parse(fs.readFileSync('actor.json','utf8')).data;
          const current = actor.pricingInfos?.[actor.pricingInfos.length - 1];
          const event = current?.pricingPerEvent?.actorChargeEvents?.['pdf-extraction'];
          if (!actor.isPublic) throw new Error('Actor is not public.');
          if (actor.defaultRunOptions?.forcePermissionLevel !== 'LIMITED_PERMISSIONS') throw new Error('Actor is not limited-permissions.');
          if (actor.actorStandby?.isEnabled) throw new Error('Standby must be disabled.');
          if (current?.pricingModel !== 'PAY_PER_EVENT') throw new Error('Actor is not PPE.');
          if (!event?.isPrimaryEvent) throw new Error('Primary event not configured.');
          console.log(JSON.stringify({
            isPublic: actor.isPublic,
            pricingModel: current?.pricingModel,
            eventPriceUsd: event?.eventPriceUsd
          }, null, 2));
          NODE

      - name: Smoke test
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
        run: |
          curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Authorization: Bearer $APIFY_TOKEN" \
            --header "Content-Type: application/json" \
            --data '{"urls":["https://www.w3.org/WAI/ER/tests/xhtml/testfiles/resources/pdf/dummy.pdf"]}' \
            "https://api.apify.com/v2/actors/industrial_platform~pdf-text-intelligence/run-sync-get-dataset-items?clean=true&format=json&timeout=90" \
            > result.json

          node <<'NODE'
          const fs = require('fs');
          const rows = JSON.parse(fs.readFileSync('result.json', 'utf8'));
          if (!Array.isArray(rows) || rows.length !== 1) throw new Error('Expected one dataset row.');
          if (rows[0].status !== 'ready') throw new Error(`Smoke test status was ${rows[0].status}`);
          if (!rows[0].text || rows[0].text.length < 10) throw new Error('Smoke test returned insufficient PDF text.');
          console.log(JSON.stringify({
            status: rows[0].status,
            page_count: rows[0].page_count,
            text_length: rows[0].text_length,
            title: rows[0].title
          }, null, 2));
          NODE
