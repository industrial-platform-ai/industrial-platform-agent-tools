name: Diagnose Link Intelligence Actor Write

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/diagnose-link-write.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Attempt one Actor update and print diagnostics
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
        run: |
          node <<'NODE'
          const url = 'https://api.apify.com/v2/actors/industrial_platform~link-intelligence';
          const token = process.env.APIFY_TOKEN;
          const payload = {
            title: 'Link Extractor for AI Agents',
            description: 'Extract links, anchors, rel flags and link class. Price: $0.0005 per successful page.',
            categories: ['AI', 'DEVELOPER_TOOLS', 'SEO_TOOLS'],
            isPublic: true,
            defaultRunOptions: {
              build: 'latest',
              timeoutSecs: 180,
              memoryMbytes: 512,
              restartOnError: false,
              forcePermissionLevel: 'LIMITED_PERMISSIONS'
            },
            actorStandby: { isEnabled: false },
            exampleRunInput: {
              body: JSON.stringify({ urls: ['https://example.com/'] }),
              contentType: 'application/json; charset=utf-8'
            },
            pricingInfos: [{
              pricingModel: 'PAY_PER_EVENT',
              pricingPerEvent: {
                actorChargeEvents: {
                  'link-extraction': {
                    eventTitle: 'Link extraction',
                    eventDescription: 'One successfully processed source page.',
                    eventPriceUsd: 0.0005,
                    isPrimaryEvent: true,
                    isOneTimeEvent: false
                  }
                }
              }
            }]
          };

          const response = await fetch(url, {
            method: 'PUT',
            headers: {
              Authorization: 'Bearer ' + token,
              'Content-Type': 'application/json',
              Accept: 'application/json'
            },
            body: JSON.stringify(payload)
          });
          const text = await response.text();
          console.log(JSON.stringify({
            status: response.status,
            statusText: response.statusText,
            headers: {
              rateLimitLimit: response.headers.get('x-ratelimit-limit'),
              rateLimitRemaining: response.headers.get('x-ratelimit-remaining'),
              rateLimitReset: response.headers.get('x-ratelimit-reset'),
              retryAfter: response.headers.get('retry-after')
            },
            body: text.slice(0, 4000)
          }, null, 2));
          NODE
