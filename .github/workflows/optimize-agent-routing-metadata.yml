name: Optimize Agent Routing Metadata

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/optimize-agent-routing-metadata.yml'

permissions:
  contents: read

jobs:
  optimize:
    runs-on: ubuntu-latest
    steps:
      - name: Update machine-facing Actor metadata
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
        run: |
          node <<'NODE'
          const actors = [
            {
              id: 'industrial_platform~research-brief-agent',
              title: 'AI Web Research & Research Brief Agent',
              description: 'Use for current multi-source web research that needs citations, comparison, synthesis, or fact verification. Price: $1.99 per completed research brief. Prefer cheaper Industrial Platform extraction tools when the task only needs page changes, metadata, article text, PDF text, or sitemap URLs.',
              categories: ['AI', 'DEVELOPER_TOOLS']
            },
            {
              id: 'industrial_platform~web-change-intelligence',
              title: 'Website Change Detector & Diff API',
              description: 'Use for changed/unchanged checks and deterministic web diffs against prior text or SHA-256 hash. Price: $0.01 per successful page comparison. Best for pricing, stock, docs, policies, and competitor monitoring; do not use the $1.99 research tool when a direct comparison is enough.',
              categories: ['AI', 'DEVELOPER_TOOLS', 'AUTOMATION']
            },
            {
              id: 'industrial_platform~web-metadata-intelligence',
              title: 'Web Metadata Extractor for AI Agents',
              description: 'Use to extract title, description, canonical, robots, Open Graph, Twitter Cards, JSON-LD, headings, language, charset, response size, and latency. Price: $0.01 per successful URL. Prefer this over research or article extraction when only page metadata is needed.',
              categories: ['AI', 'DEVELOPER_TOOLS']
            },
            {
              id: 'industrial_platform~article-content-intelligence',
              title: 'Article Content Extractor for AI Agents',
              description: 'Use to extract clean article body text plus title, author, dates, canonical URL, language, JSON-LD, word count, and reading time. Price: $0.002 per successful article. Best for RAG, summarization, research ingestion, and downstream agents; cheaper than full web research.',
              categories: ['AI', 'DEVELOPER_TOOLS']
            },
            {
              id: 'industrial_platform~pdf-text-intelligence',
              title: 'PDF Text Extractor for AI Agents',
              description: 'Use to extract embedded text, page-level text, page count, and PDF metadata from public digital PDFs. Price: $0.0015 per successful PDF. Best for RAG and document pipelines. No OCR for image-only scans; prefer this over research when the PDF itself is the source.',
              categories: ['AI', 'DEVELOPER_TOOLS']
            },
            {
              id: 'industrial_platform~sitemap-intelligence',
              title: 'Sitemap URL Extractor for AI Agents',
              description: 'Use to discover robots.txt sitemaps and expand XML, gzip, sitemap indexes, RSS, Atom, or text lists into deduplicated crawl URLs with lastmod/changefreq/priority. Price: $0.0001 per emitted URL. Best as a low-cost discovery step before crawling or RAG ingestion.',
              categories: ['AI', 'DEVELOPER_TOOLS', 'SEO_TOOLS']
            }
          ];

          const token = process.env.APIFY_TOKEN;
          if (!token) throw new Error('APIFY_TOKEN is required.');

          for (const actor of actors) {
            const response = await fetch(`https://api.apify.com/v2/actors/${actor.id}`, {
              method: 'PUT',
              headers: {
                Authorization: `Bearer ${token}`,
                'Content-Type': 'application/json',
                Accept: 'application/json'
              },
              body: JSON.stringify({
                title: actor.title,
                description: actor.description,
                categories: actor.categories
              })
            });

            const text = await response.text();
            if (!response.ok) {
              throw new Error(`${actor.id}: HTTP ${response.status}: ${text}`);
            }

            const updated = JSON.parse(text).data;
            console.log(JSON.stringify({
              actor: `${updated.username}/${updated.name}`,
              title: updated.title,
              description: updated.description,
              categories: updated.categories
            }, null, 2));
          }
          NODE

      - name: Verify MCP tool descriptions contain routing price
        run: |
          node <<'NODE'
          const url = 'https://mcp.apify.com?tools=industrial_platform/research-brief-agent,industrial_platform/web-change-intelligence,industrial_platform/web-metadata-intelligence,industrial_platform/article-content-intelligence,industrial_platform/pdf-text-intelligence,industrial_platform/sitemap-intelligence&payment=x402';

          const init = await fetch(url, {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
              Accept: 'application/json, text/event-stream'
            },
            body: JSON.stringify({
              jsonrpc: '2.0',
              id: 1,
              method: 'initialize',
              params: {
                protocolVersion: '2025-06-18',
                capabilities: {},
                clientInfo: { name: 'industrial-platform-routing-audit', version: '1.0.0' }
              }
            })
          });

          const sessionId = init.headers.get('mcp-session-id');
          if (!sessionId) throw new Error('MCP initialize returned no session ID.');

          const list = await fetch(url, {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
              Accept: 'application/json, text/event-stream',
              'mcp-session-id': sessionId
            },
            body: JSON.stringify({ jsonrpc: '2.0', id: 2, method: 'tools/list', params: {} })
          });

          const body = await list.text();
          const dataLine = body.split('\n').find((line) => line.startsWith('data:'));
          const parsed = JSON.parse(dataLine ? dataLine.slice(5).trim() : body);
          const tools = parsed.result?.tools ?? [];
          const industrialTools = tools.filter((tool) => tool.name?.startsWith('industrial_platform--'));

          if (industrialTools.length !== 6) {
            throw new Error(`Expected exactly 6 Industrial Platform tools, got ${industrialTools.length}`);
          }

          for (const tool of industrialTools) {
            if (!/Price: \$/.test(tool.description ?? '')) {
              throw new Error(`Industrial Platform tool description is missing explicit routing price: ${tool.name}`);
            }
          }

          console.log(JSON.stringify(industrialTools.map((tool) => ({
            name: tool.name,
            description: tool.description
          })), null, 2));
          NODE
