name: Optimize Agent Routing Metadata

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/optimize-agent-routing-metadata.yml'

permissions:
  contents: read

jobs:
  optimize:
    runs-on: ubuntu-latest
    steps:
      - name: Update machine-facing Actor metadata
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
        run: |
          node <<'NODE'
          const actors = [
            {
              id: 'industrial_platform~research-brief-agent',
              title: 'AI Web Research & Research Brief Agent',
              description: 'Cited multi-source web research and synthesis. Price: $1.99 per completed brief.',
              categories: ['AI', 'DEVELOPER_TOOLS']
            },
            {
              id: 'industrial_platform~web-change-intelligence',
              title: 'Website Change Detector & Diff API',
              description: 'Detect page changes and deterministic diffs. Price: $0.01 per successful comparison.',
              categories: ['AI', 'DEVELOPER_TOOLS', 'AUTOMATION']
            },
            {
              id: 'industrial_platform~web-metadata-intelligence',
              title: 'Web Metadata Extractor for AI Agents',
              description: 'Extract metadata, Open Graph, JSON-LD and headings. Price: $0.01 per successful URL.',
              categories: ['AI', 'DEVELOPER_TOOLS']
            },
            {
              id: 'industrial_platform~article-content-intelligence',
              title: 'Article Content Extractor for AI Agents',
              description: 'Extract clean article text and metadata. Price: $0.002 per successful article.',
              categories: ['AI', 'DEVELOPER_TOOLS']
            },
            {
              id: 'industrial_platform~pdf-text-intelligence',
              title: 'PDF Text Extractor for AI Agents',
              description: 'Extract embedded PDF text, pages and metadata. Price: $0.0015 per successful PDF.',
              categories: ['AI', 'DEVELOPER_TOOLS']
            },
            {
              id: 'industrial_platform~sitemap-intelligence',
              title: 'Sitemap URL Extractor for AI Agents',
              description: 'Discover and expand sitemaps into crawl URLs. Price: $0.0001 per emitted URL.',
              categories: ['AI', 'DEVELOPER_TOOLS', 'SEO_TOOLS']
            },
            {
              id: 'industrial_platform~link-intelligence',
              title: 'Link Extractor for AI Agents',
              description: 'Extract links, anchors, rel flags and link class. Price: $0.0005 per successful page.',
              categories: ['AI', 'DEVELOPER_TOOLS', 'SEO_TOOLS']
            },
            {
              id: 'industrial_platform~robots-policy-intelligence',
              title: 'Robots.txt Policy Analyzer for AI Agents',
              description: 'Parse robots.txt and test crawler rules. Price: $0.0005 per analyzed site.',
              categories: ['AI', 'DEVELOPER_TOOLS', 'SEO_TOOLS']
            }
          ];

          const token = process.env.APIFY_TOKEN;
          if (!token) throw new Error('APIFY_TOKEN is required.');

          for (const actor of actors) {
            const response = await fetch(`https://api.apify.com/v2/actors/${actor.id}`, {
              method: 'PUT',
              headers: {
                Authorization: `Bearer ${token}`,
                'Content-Type': 'application/json',
                Accept: 'application/json'
              },
              body: JSON.stringify({
                title: actor.title,
                description: actor.description,
                categories: actor.categories
              })
            });

            const text = await response.text();
            if (!response.ok) {
              throw new Error(`${actor.id}: HTTP ${response.status}: ${text}`);
            }

            const updated = JSON.parse(text).data;
            console.log(JSON.stringify({
              actor: `${updated.username}/${updated.name}`,
              title: updated.title,
              description: updated.description,
              categories: updated.categories
            }, null, 2));
          }
          NODE

      - name: Verify MCP tool descriptions contain routing price
        run: |
          node <<'NODE'
          const url = 'https://mcp.apify.com?tools=industrial_platform/research-brief-agent,industrial_platform/web-change-intelligence,industrial_platform/web-metadata-intelligence,industrial_platform/article-content-intelligence,industrial_platform/pdf-text-intelligence,industrial_platform/sitemap-intelligence,industrial_platform/link-intelligence,industrial_platform/robots-policy-intelligence&payment=x402';

          const init = await fetch(url, {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
              Accept: 'application/json, text/event-stream'
            },
            body: JSON.stringify({
              jsonrpc: '2.0',
              id: 1,
              method: 'initialize',
              params: {
                protocolVersion: '2025-06-18',
                capabilities: {},
                clientInfo: { name: 'industrial-platform-routing-audit', version: '1.0.0' }
              }
            })
          });

          const sessionId = init.headers.get('mcp-session-id');
          if (!sessionId) throw new Error('MCP initialize returned no session ID.');

          const list = await fetch(url, {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
              Accept: 'application/json, text/event-stream',
              'mcp-session-id': sessionId
            },
            body: JSON.stringify({ jsonrpc: '2.0', id: 2, method: 'tools/list', params: {} })
          });

          const body = await list.text();
          const dataLine = body.split('\n').find((line) => line.startsWith('data:'));
          const parsed = JSON.parse(dataLine ? dataLine.slice(5).trim() : body);
          const tools = parsed.result?.tools ?? [];
          const industrialTools = tools.filter((tool) => tool.name?.startsWith('industrial_platform--'));

          const desiredToolCount = 8;
          const minimumEstablishedToolCount = 6;
          if (industrialTools.length < minimumEstablishedToolCount || industrialTools.length > desiredToolCount) {
            throw new Error(`Unexpected Industrial Platform tool count: ${industrialTools.length}`);
          }

          const stale = industrialTools.filter((tool) => !/Price: \$/.test(tool.description ?? ''));

          console.log(JSON.stringify({
            total_exposed: industrialTools.length,
            desired_total: desiredToolCount,
            quota_deferred_or_propagating: desiredToolCount - industrialTools.length,
            converged: industrialTools.length - stale.length,
            stale: stale.map((tool) => tool.name),
            tools: industrialTools.map((tool) => ({
              name: tool.name,
              description: tool.description
            }))
          }, null, 2));

          if (stale.length) {
            console.log('Hosted MCP descriptions have not fully converged yet; treating as propagation lag, not a deployment failure.');
          }
          NODE
