name: Verify Industrial Platform on AllMCPs

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'README.md'
      - '.github/workflows/verify-allmcps.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Verify claim through AllMCPs MCP
        run: |
          node <<'NODE'
          const endpoint = 'https://allmcps.com/api/mcp';

          async function rpc(method, params) {
            const response = await fetch(endpoint, {
              method: 'POST',
              headers: { 'content-type': 'application/json' },
              body: JSON.stringify({ jsonrpc: '2.0', id: 1, method, params })
            });
            const body = await response.json();
            if (!response.ok || body.error) throw new Error(JSON.stringify(body.error ?? body));
            return body.result;
          }

          const tools = await rpc('tools/list');
          const tool = (tools.tools ?? []).find(t => t.name === 'verify_mcp_claim');
          if (!tool) throw new Error('verify_mcp_claim tool not found');
          console.log('schema=' + JSON.stringify(tool.inputSchema));

          const props = tool.inputSchema?.properties ?? {};
          const args = {};
          if ('id' in props) args.id = 'industrial-platform';
          if ('server_id' in props) args.server_id = 'industrial-platform';
          if ('slug' in props) args.slug = 'industrial-platform';

          for (const required of tool.inputSchema?.required ?? []) {
            if (!(required in args)) throw new Error('Unhandled required field: ' + required);
          }

          const result = await rpc('tools/call', {
            name: 'verify_mcp_claim',
            arguments: args
          });
          console.log('verification_result=' + JSON.stringify(result));
          console.log((result.content ?? []).map(x => x.text ?? '').join('\n'));
          NODE
